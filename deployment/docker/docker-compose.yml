version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: careercure_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: careercure
      POSTGRES_PASSWORD: careercure
      POSTGRES_DB: careercure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercure"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: careercure_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://careercure:careercure@db:5432/careercure
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama3-8b-8192
      CHROMA_PERSIST_DIR: /app/chroma_data
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - chroma_data:/app/chroma_data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: careercure_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
